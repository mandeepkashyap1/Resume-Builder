<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">ResumeBuilder</a>
        <div class="d-flex gap-2">
          <button id="themeToggle" class="btn btn-outline-secondary btn-sm rounded-pill">🌙 Dark Mode</button>
          <a href="builder.html" class="btn btn-outline-secondary btn-sm rounded-pill">Edit</a>
          <button id="downloadPdfBtn" class="btn btn-primary btn-sm rounded-pill">Download PDF</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="section-card p-4 rounded-4 shadow-sm mb-4 fade-up">
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label" for="templateSelect">Template</label>
            <select id="templateSelect" class="form-select" aria-label="Template">
              <option value="modern">Modern</option>
              <option value="corporate">Professional Corporate</option>
              <option value="minimal">Minimal Clean</option>
              <option value="creative">Creative Designer Style</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="accentColor">Accent Color</label>
            <input id="accentColor" class="form-control form-control-color" type="color" value="#2563eb" aria-label="Accent color" />
          </div>
          <div class="col-md-3">
            <label class="form-label" for="fontSelect">Font</label>
            <select id="fontSelect" class="form-select" aria-label="Font">
              <option value="Inter, sans-serif">Inter</option>
              <option value="Georgia, serif">Serif</option>
              <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="layoutSelect">Layout</label>
            <select id="layoutSelect" class="form-select" aria-label="Layout">
              <option value="single">Single Page</option>
              <option value="multi">Multi Page</option>
            </select>
          </div>
        </div>
      </div>

      <div class="resume-shell">
        <div id="resumePreview" class="resume-preview modern"></div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script/preview.js"></script>
    <script src="script/template-switcher.js"></script>
    <script src="script/pdf-export.js"></script>
  </body>
</html>
